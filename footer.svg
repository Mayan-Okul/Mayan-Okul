<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 70" width="100%" height="100%">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#07020d"/>
      <stop offset="50%" stop-color="#19062b"/>
      <stop offset="100%" stop-color="#07020d"/>
    </linearGradient>
    <filter id="pulseGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="900" height="70" rx="8" fill="url(#footerBg)"/>
  
  <!-- Pulse Line across center -->
  <path d="M 30 35 L 340 35 L 360 15 L 380 55 L 400 25 L 415 45 L 430 35 L 870 35" 
        stroke="#FF007F" stroke-width="2" fill="none" filter="url(#pulseGlow)"/>
  
  <text x="450" y="58" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#FF77B6" letter-spacing="3">
    ⚡ MAYAN // KISUMU, KENYA // END TRANSMISSION ⚡
  </text>
</svg>
